name: Build XiaoZhi Firmware (Eyes + Radar + Phone HID)

# 用法：Actions -> Build XiaoZhi Firmware (Eyes + Radar + Phone HID) -> Run workflow
# 目标：v2.5.3（main 分支 a73e9a7e）+ 全屏大眼睛 + 蚊子雷达 + 唤醒词「你好小鑫」
#       + BOOT 双击随机播放 7 条本地 Ogg/Opus 音效（编译进 app，不占 assets 分区）
#       + 蚊子雷达守望模式：说「帮我盯着蚊子」后持续监测，检出即主动提醒
#       + 手机遥控：BLE HID 键盘/媒体键，iPhone 配对后语音控制
on:
  workflow_dispatch:

env:
  UPSTREAM_SHA: a73e9a7e266e3196d1368ba46c30bee0d81f0a64

jobs:
  build:
    name: Build bread-compact-wifi (128x32, 你好小鑫, 雷达 + 手机遥控)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: 取出补丁文件
        uses: actions/checkout@v4

      - name: 拉取上游源码 v2.5.3
        run: |
          set -e
          curl -sL --retry 3 --max-time 300 \
            "https://codeload.github.com/78/xiaozhi-esp32/zip/$UPSTREAM_SHA" -o /tmp/src.zip
          mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          SRC_DIR=$(ls -d /tmp/src/*/ | head -1)
          mv "$SRC_DIR" /tmp/upstream
          grep -n 'PROJECT_VER' /tmp/upstream/CMakeLists.txt | head -2

      - name: 应用补丁（大眼睛 + 蚊子雷达 + 手机遥控）
        run: |
          set -e
          cp oled_display.cc /tmp/upstream/main/display/oled_display.cc
          cp oled_display.h  /tmp/upstream/main/display/oled_display.h
          cp mosquito_detector.h /tmp/upstream/main/boards/common/mosquito_detector.h
          cp roast_sounds.h /tmp/upstream/main/boards/common/roast_sounds.h
          cp mosquito_alert.h /tmp/upstream/main/boards/common/mosquito_alert.h
          cp phone_hid.h /tmp/upstream/main/boards/common/phone_hid.h
          cp config.h /tmp/upstream/main/boards/bread-compact-wifi/config.h
          cp compact_wifi_board.cc /tmp/upstream/main/boards/bread-compact-wifi/compact_wifi_board.cc
          grep -q "EyesForEmotion" /tmp/upstream/main/display/oled_display.cc
          grep -q "StartBlinkAnim"  /tmp/upstream/main/display/oled_display.h
          grep -q "bool OledDisplay::SetEmotion" /tmp/upstream/main/display/oled_display.cc
          grep -q "MOSQUITO_MIC_GPIO" /tmp/upstream/main/boards/bread-compact-wifi/config.h
          grep -q "MosquitoDetector mosquito" /tmp/upstream/main/boards/bread-compact-wifi/compact_wifi_board.cc
          grep -q "ROAST_SOUND_COUNT" /tmp/upstream/main/boards/common/roast_sounds.h
          grep -q "PlayRandomRoast" /tmp/upstream/main/boards/bread-compact-wifi/compact_wifi_board.cc
          grep -q "self.mosquito.watch" /tmp/upstream/main/boards/common/mosquito_detector.h
          grep -q "MOSQUITO_ALERT_SOUND" /tmp/upstream/main/boards/common/mosquito_alert.h
          grep -q "PHONE_HID_ENABLED" /tmp/upstream/main/boards/bread-compact-wifi/config.h
          grep -q "static PhoneHid phone_hid" /tmp/upstream/main/boards/bread-compact-wifi/compact_wifi_board.cc
          grep -q "self.phone.media" /tmp/upstream/main/boards/common/phone_hid.h
          grep -q "XiaoZhi-Phone" /tmp/upstream/main/boards/common/phone_hid.h
          echo "补丁已应用（含 7 条本地音效 + 蚊子守望 + BLE 手机遥控）"

      - name: 补组件依赖（esp_adc / esp_hid）
        run: |
          set -e
          cd /tmp/upstream/main
          python3 - <<'PY'
          import re
          s = open('CMakeLists.txt').read()
          m = re.search(r'idf_component_register\(', s)
          if not m:
              raise SystemExit('找不到 idf_component_register(')
          i = s.index('PRIV_REQUIRES', m.end())
          j = s.index('\n', i) + 1
          requires_line = s[i:j]
          # 上游已含 bt；esp_hid 提供 esp_hidd_dev_* / esp_hidd_gatts_event_handler
          for dep in ('esp_adc', 'esp_hid'):
              if not re.search(r'\b' + dep + r'\b', requires_line):
                  s = s[:j] + '                        ' + dep + '\n' + s[j:]
                  j += len(dep) + 25
          open('CMakeLists.txt', 'w').write(s)
          print('esp_adc + esp_hid ok')
          PY
          grep -n "esp_adc\|esp_hid" CMakeLists.txt

      - name: 打开 BLE（S3 / Bluedroid）
        run: |
          set -e
          cd /tmp/upstream
          cat >> sdkconfig.defaults <<'EOF'

          # ---- BLE HID for phone remote ----
          CONFIG_BT_ENABLED=y
          CONFIG_BT_BLUEDROID_ENABLED=y
          CONFIG_BT_BLE_ENABLED=y
          CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
          CONFIG_BT_GATTS_ENABLE=y
          # 关键：BT 栈优先用 PSRAM，把内部 SRAM 让给 WiFi/TLS/MQTT
          # 注意：不要关 GATTC / 不要开 BLE 5.0，会导致 esp_ble_gap_* 符号链接失败
          CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=y
          CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY=y
          EOF
          grep -n "CONFIG_BT_" sdkconfig.defaults

      - name: 编译 128x32 版本
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd /tmp/upstream
          python scripts/build.py bread-compact-wifi \
            --name bread-compact-wifi \
            --language zh-CN \
            --wake-word wn9_nihaoxiaoxin_tts
          ls -la build/*.bin

      - name: 收集产物
        run: |
          set -e
          mkdir -p /tmp/out
          cp /tmp/upstream/build/merged-binary.bin /tmp/out/merged-phone-hid.bin
          if [ -f /tmp/upstream/build/xiaozhi.bin ]; then
            cp /tmp/upstream/build/xiaozhi.bin /tmp/out/app-phone-hid.bin
          fi
          ls -la /tmp/out

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-phone-hid-253
          path: /tmp/out/*.bin
          if-no-files-found: error
